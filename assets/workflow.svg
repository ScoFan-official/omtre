<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">omtre workflow — one spine, four phases</title>
  <desc id="workflow-desc">A horizontal workflow: session start, plan, implement, check, finish, backed by .omtre/spec, .omtre/tasks and .omtre/workspace.</desc>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <radialGradient id="wglow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1f2937"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d444d"/>
    </marker>
  </defs>

  <rect width="1600" height="600" fill="url(#wbg)"/>
  <rect width="1600" height="600" fill="url(#wdots)" opacity="0.6"/>
  <rect width="1600" height="600" fill="url(#wglow)"/>

  <text x="72" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#e6edf3">One spine. Four phases.</text>
  <text x="72" y="128" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" fill="#9da7b3">A repo-native loop that any coding agent can follow.</text>
  <text x="1528" y="88" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="16" fill="#6e7681">22 platforms · 1,700+ catalog assets</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="60" y="200" width="260" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="60" y="200" width="260" height="4" rx="2" fill="#7ee787"/>
    <text x="84" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#7ee787">01</text>
    <text x="84" y="278" font-size="22" font-weight="700" fill="#e6edf3">Session start</text>
    <text x="84" y="316" font-size="16" fill="#9da7b3">hook injects</text>
    <text x="84" y="342" font-size="16" fill="#c9d1d9">.omtre/spec</text>
    <text x="84" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6e7681">contracts first</text>

    <rect x="360" y="200" width="260" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="360" y="200" width="260" height="4" rx="2" fill="#58a6ff"/>
    <text x="384" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#58a6ff">02</text>
    <text x="384" y="278" font-size="22" font-weight="700" fill="#e6edf3">Plan</text>
    <text x="384" y="316" font-size="16" fill="#9da7b3">PRD + context</text>
    <text x="384" y="342" font-size="16" fill="#c9d1d9">.omtre/tasks</text>
    <text x="384" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6e7681">one task at a time</text>

    <rect x="660" y="200" width="260" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="660" y="200" width="260" height="4" rx="2" fill="#d2a8ff"/>
    <text x="684" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#d2a8ff">03</text>
    <text x="684" y="278" font-size="22" font-weight="700" fill="#e6edf3">Implement</text>
    <text x="684" y="316" font-size="16" fill="#9da7b3">sub-agent writes</text>
    <text x="684" y="342" font-size="16" fill="#c9d1d9">scoped diff</text>
    <text x="684" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6e7681">no auto-commit</text>

    <rect x="960" y="200" width="260" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="960" y="200" width="260" height="4" rx="2" fill="#ffa657"/>
    <text x="984" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#ffa657">04</text>
    <text x="984" y="278" font-size="22" font-weight="700" fill="#e6edf3">Check</text>
    <text x="984" y="316" font-size="16" fill="#9da7b3">standards + spec</text>
    <text x="984" y="342" font-size="16" fill="#c9d1d9">lint · types · tests</text>
    <text x="984" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6e7681">two axes, one gate</text>

    <rect x="1260" y="200" width="260" height="200" rx="14" fill="#0d1117" stroke="#30363d"/>
    <rect x="1260" y="200" width="260" height="4" rx="2" fill="#79c0ff"/>
    <text x="1284" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#79c0ff">05</text>
    <text x="1284" y="278" font-size="22" font-weight="700" fill="#e6edf3">Finish</text>
    <text x="1284" y="316" font-size="16" fill="#9da7b3">archive + memory</text>
    <text x="1284" y="342" font-size="16" fill="#c9d1d9">.omtre/workspace</text>
    <text x="1284" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="13" fill="#6e7681">next session starts smarter</text>
  </g>

  <g stroke="#3d444d" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="326" y1="300" x2="352" y2="300"/>
    <line x1="626" y1="300" x2="652" y2="300"/>
    <line x1="926" y1="300" x2="952" y2="300"/>
    <line x1="1226" y1="300" x2="1252" y2="300"/>
  </g>

  <rect x="60" y="464" width="1460" height="78" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="17">
    <text x="92" y="500" fill="#7ee787">.omtre/spec</text>
    <text x="92" y="524" fill="#6e7681" font-size="14">contracts · source of truth</text>
    <line x1="560" y1="480" x2="560" y2="526" stroke="#21262d"/>
    <text x="596" y="500" fill="#58a6ff">.omtre/tasks</text>
    <text x="596" y="524" fill="#6e7681" font-size="14">state · PRD · implement · check</text>
    <line x1="1070" y1="480" x2="1070" y2="526" stroke="#21262d"/>
    <text x="1106" y="500" fill="#79c0ff">.omtre/workspace</text>
    <text x="1106" y="524" fill="#6e7681" font-size="14">memory · journals · shared context</text>
  </g>

  <text x="72" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="15" fill="#6e7681">omtre · the workflow harness for AI coding agents</text>
</svg>
