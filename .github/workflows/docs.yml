name: Docs

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Typecheck Python
        run: pnpm --filter omtre lint:py

      - name: Verify documentation
        run: pnpm docs:verify

      - name: Install Playwright Chromium
        run: pnpm --dir docs-site exec playwright install --with-deps chromium

      - name: Run documentation browser smoke tests
        run: pnpm docs:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-diagnostics
          path: |
            docs-site/.vitepress/playwright-report
            docs-site/.vitepress/test-results
          if-no-files-found: ignore

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/.vitepress/dist
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published pages
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail

          fetch() {
            local path="$1"
            local code=""
            for _ in $(seq 1 18); do
              code=$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${BASE_URL%/}${path}" || true)
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::${path} did not return HTTP 200 (last status: ${code:-network error})"
            return 1
          }

          fetch "/"
          fetch "/start/install-and-first-task.html"
          fetch "/reference/platform-matrix.html"
          fetch "/llms.txt"
          fetch "/sitemap.xml"
          fetch "/favicon.ico"
          fetch "/brand/mark-dark.svg"
          fetch "/brand/og.png"

          for _ in $(seq 1 18); do
            if curl -fsSL --max-time 20 "${BASE_URL%/}/" | grep -Fq "让每一次 AI 编码"; then
              echo "Published documentation is reachable and rendered."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Published homepage did not contain the expected rendered content"
          exit 1
