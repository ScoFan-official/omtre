name: Publish to npm

# npm is omtre's primary install channel. This workflow is dispatchable for the
# first release and also runs on `cli-v*` tags once NPM_TOKEN is configured.
# The CLI package bundles @omtre/core, so publishing only `omtre` is a complete
# install; `@omtre/core` is published separately only when explicitly requested
# (it requires the npm `omtre` org).
on:
  workflow_dispatch:
    inputs:
      publish_core:
        description: "Also publish @omtre/core (requires the npm omtre org)"
        type: boolean
        default: false
  push:
    tags: ["cli-v*"]

concurrency:
  group: publish-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Check npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured. Add a repository secret named NPM_TOKEN."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/omtre.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github

      - name: Publish omtre
        if: steps.plan.outputs.cli_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip omtre (already on npm)
        if: steps.plan.outputs.cli_publish != 'true'
        run: echo "omtre@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Verify published omtre on npm
        run: node packages/cli/scripts/release-preflight.js verify-npm --package cli

      - name: Publish @omtre/core
        if: github.event_name == 'workflow_dispatch' && inputs.publish_core == true && steps.plan.outputs.core_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip @omtre/core
        if: github.event_name != 'workflow_dispatch' || inputs.publish_core != true || steps.plan.outputs.core_publish != 'true'
        run: echo "@omtre/core is bundled into the CLI; separate publish not requested or already done."

      - name: Summary
        run: |
          echo "### Published omtre@${{ steps.plan.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/omtre" >> "$GITHUB_STEP_SUMMARY"
          echo "- install: \`npm install -g omtre\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
