name: cli-release

# GitHub Release channel: ScoFan-official/omtre is the unified source/build
# workspace. This pipeline builds the CLI from the matching `cli-v<version>`
# tag and publishes the standalone `omtre-<version>.tgz` asset. npm publishing
# runs in publish.yml; the two channels carry the same version.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  cli-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          node packages/cli/scripts/release-preflight.js check-versions --require-tag
          node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Pack CLI
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$GITHUB_WORKSPACE"

      - name: Create release with asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" omtre-*.tgz --generate-notes --repo "${{ github.repository }}"
