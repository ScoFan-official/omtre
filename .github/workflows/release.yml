name: release

# Canonical CLI artifacts publish from ScoFan-official/omtre via its
# `cli-v*` tag pipeline (cli-release.yml). This workflow stays dispatch-only
# for internal tarball testing; release tags are NOT pushed to trigger it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node packages/cli/scripts/release-preflight.js verify-packed-cli
      - name: Pack CLI
        id: pack
        working-directory: packages/cli
        run: |
          TGZ=$(pnpm pack --pack-destination "$GITHUB_WORKSPACE" 2>/dev/null | tail -1 | tr -d '\r')
          [ -f "$GITHUB_WORKSPACE/$TGZ" ] || TGZ=$(basename "$TGZ")
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.tgz }}
          path: ${{ steps.pack.outputs.tgz }}
      # Legacy tag-triggered publishing is deprecated (canonical surface =
      # omtre `cli-v*` releases). Kept only for the unlikely case the
      # tag trigger is re-enabled — dispatch runs never reach it.
      - name: Create release with asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.pack.outputs.tgz }}" --generate-notes
